    <style>
        :root { --g: #3BB489; --g2: #76C58C; --bg: #f4f8f6; --tx: #1f2937; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--tx); }
        .dec { position: relative; overflow: hidden; }
        .dec:before, .dec:after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); }
        .dec:before { width: 130px; height: 130px; right: -35px; top: -40px; }
        .dec:after { width: 90px; height: 90px; right: 30px; bottom: -45px; }
        .sk { background: linear-gradient(90deg, #e5ece9 25%, #f3f7f5 50%, #e5ece9 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; }
        @keyframes sh { to { background-position: -200% 0; } }
        .sp { width: 44px; height: 44px; border: 4px solid #d6efe5; border-top-color: var(--g); border-radius: 50%; animation: r .8s linear infinite; }
        @keyframes r { to { transform: rotate(360deg); } }
        .mi { display: flex; gap: .7rem; align-items: center; padding: .7rem 1rem; border-radius: 12px; color: #4b5563; cursor: pointer; transition: .2s; }
        .mi:hover { background: #e8f6f0; }
        .mi.on { background: linear-gradient(135deg, #3BB489, #76C58C); color: #fff; box-shadow: 0 6px 14px #3bb48955; }
        .inp { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: .55rem .8rem; outline: none; }
        .inp:focus { border-color: var(--g); box-shadow: 0 0 0 3px #3bb48922; }
        .btn { padding: .5rem 1rem; border-radius: 10px; color: #fff; font-weight: 500; transition: .2s; cursor: pointer; border: none; }
        .btn:hover { filter: brightness(.95); transform: translateY(-1px); }
        th { cursor: pointer; white-space: nowrap; }
        .swal2-popup { font-family: 'Sarabun'; }
        .rt { position: relative; display: inline-block; }
        .rt input { position: absolute; opacity: 0; width: 100%; height: 100%; left: 0; top: 0; margin: 0; cursor: pointer; }
        .rt span { display: inline-flex; width: 52px; height: 52px; align-items: center; justify-content: center; border: 2px solid #d1d5db; border-radius: 14px; font-size: 1.15rem; font-weight: 600; color: #4b5563; background: #fff; transition: .15s; }
        .rt:hover span { border-color: #3BB489; background: #e8f6f0; }
        .rt input:checked + span { background: #3BB489; border-color: #3BB489; color: #fff; box-shadow: 0 4px 10px #3bb48955; }
        .rt input:focus-visible + span { outline: 3px solid #3bb48966; }
        .eval-popup { font-family: 'Sarabun', sans-serif; }
        span.rounded-full { white-space: nowrap; display: inline-block; }
        .tbl-docs table { table-layout: fixed; width: 100%; min-width: 980px; }
        .tbl-docs th, .tbl-docs td { padding: .85rem .75rem; vertical-align: middle; }
        .tbl-docs th:nth-child(2) { width: 210px; } .tbl-docs th:nth-child(3) { width: 130px; }
        .tbl-docs th:nth-child(4) { width: 100px; } .tbl-docs th:nth-child(5) { width: 200px; } .tbl-docs th:nth-child(6) { width: 120px; }
        .tbl-docs td:nth-child(1) { line-height: 1.5; }
        .eval-popup .swal2-html-container { max-height: 68vh; overflow-y: auto; text-align: left; margin: 1em 1.2em .3em; }
        .eval-row { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; justify-content: space-between; padding: 1rem .5rem; border-bottom: 1px solid #e5e7eb; }
        .eval-row:last-child { border-bottom: 0; }
        .eval-q { flex: 1 1 420px; font-size: 1.1rem; line-height: 1.6; color: #1f2937; }
        .eval-rt { display: flex; gap: .5rem; }
        :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
        
        @media print {
            body * { visibility: hidden; }
            #report-printable, #report-printable * { visibility: visible; }
            #report-printable { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 1rem; }
            .no-print, header, aside, .btn, .swal2-container { display: none !important; }
            .bg-white { box-shadow: none !important; border: 1px solid #ddd; break-inside: avoid; }
            canvas { max-width: 100% !important; }
            .grid { display: block !important; }
            .grid > div { margin-bottom: 20px; }
            ::-webkit-scrollbar { display: none; }
        }
    
        :root[data-theme="light"] { --bg: #fff; --text: #000; --border: #e5e7eb; --btn-bg: #3BB489; }
        :root[data-theme="dark"] { --bg: #1f2937; --text: #f3f4f6; --border: #374151; --btn-bg: #2d9d7b; }
        * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { background: var(--bg); color: var(--text); }
        
        @media (max-width: 768px) {
            .btn { min-height: 44px; padding: 0.625rem !important; font-size: 0.95rem; }
            .inp { min-height: 44px; padding: 0.5rem; font-size: 0.95rem; }
            .text-\[20pt\] { font-size: 14pt !important; }
            .w-80 { width: 100% !important; }
            .flex-wrap { flex-wrap: wrap; }
        }
        
        .btn { user-select: none; }
        .btn:active { transform: scale(0.98); }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--btn-bg); outline-offset: 2px; }
        
        table { width: 100%; border-collapse: collapse; }
        table thead { position: sticky; top: 0; z-index: 10; background: var(--bg); }
        table th { padding: 0.75rem; text-align: left; font-weight: 600; background: var(--bg); color: var(--text); border-bottom: 2px solid var(--border); }
        table td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        table tbody tr:hover { background: rgba(59, 180, 137, 0.05); }
        @media (max-width: 768px) {
            table { font-size: 0.85rem; }
            table th, table td { padding: 0.5rem; }
        }

    <div id="splash" class="fixed inset-0 z-[100] flex flex-col items-center justify-center text-white dec" style="background:linear-gradient(135deg,#3BB489,#76C58C 60%,#AED581); transition: opacity 0.5s ease;">

        <div class="text-xl font-semibold text-center px-4">ระบบประเมินผลหลักสูตรพยาบาลศาสตรมหาบัณฑิต</div>

    <script>
        // Hide splash as early as possible — before all libs load
        // This runs immediately when this inline <script> tag is parsed
        function hideSplash() {
            var sp = document.getElementById('splash');
            if (sp) { sp.style.opacity = '0'; setTimeout(function(){ sp.style.display = 'none'; }, 500); }
        }
        // Absolute max fallback: hide after 4 seconds no matter what
        setTimeout(hideSplash, 4000);
        // Also hook into DOMContentLoaded as an early trigger
        document.addEventListener('DOMContentLoaded', function() {
            // Give main script 300ms to run initLoad first, then hide splash
            setTimeout(hideSplash, 500);
        });
    </script>

        async function doLogin(mode = currentLoginTab) {
            let u = '', p = '';
            if (mode === 'student') {
                u = ($('#stu_u')?.value || '').trim();
                p = ($('#stu_p')?.value || '').trim();
                if (!u) return err('กรุณากรอกรหัสนักศึกษา');
                if (!p) return err('กรุณากรอกเลขประจำตัวประชาชน');
            } else {
                u = ($('#staff_u')?.value || '').trim();
                p = ($('#staff_p')?.value || '').trim();
                if (!u) return err('กรุณากรอกอีเมล หรือชื่อผู้ใช้งาน');
                if (!p) return err('กรุณากรอกรหัสผ่าน');
            }

            await busy(async () => {
                let x = null;
                let role = '';

                if (mode === 'student') {
                    // ค้นหานักศึกษาใน D.users โดยเทียบรหัส และรหัสผ่าน
                    x = D.users.find(s => {
                        const sU = String(s.u || '').trim().toLowerCase();
                        const sP = String(s.p || '').trim();
                        const sPos = String(s.pos || '').trim();
                        return sU === u.toLowerCase() && sP === p && (sPos === 'นักศึกษา' || !sPos);
                    });
                    if (!x) return err('รหัสนักศึกษา หรือเลขประจำตัวประชาชนไม่ถูกต้อง');
                    role = 'student';
                } else {
                    const uLower = u.toLowerCase();
                    // 1. ค้นหาใน Admins (เทียบ username หรือ email)
                    const a = D.admins.find(adm => {
                        const admU = String(adm.u || '').trim().toLowerCase();
                        const admEmail = String(adm.email || '').trim().toLowerCase();
                        const admP = String(adm.p || '').trim();
                        return (admU === uLower || admEmail === uLower) && admP === p;
                    });

                    if (a) {
                        x = a;
                        role = 'admin';
                    } else {
                        // 2. ค้นหาใน Users (สำหรับอาจารย์ / บุคลากร เทียบ username หรือ email)
                        const s = D.users.find(usr => {
                            const usrU = String(usr.u || '').trim().toLowerCase();
                            const usrEmail = String(usr.email || '').trim().toLowerCase();
                            const usrP = String(usr.p || '').trim();
                            const usrPos = String(usr.pos || '').trim();
                            return (usrU === uLower || (usrEmail && usrEmail === uLower)) && usrP === p && usrPos !== 'นักศึกษา';
                        });
                        if (s) {
                            x = s;
                            role = 'teacher';
                        }
                    }
                    if (!x) return err('อีเมล/ชื่อผู้ใช้งาน หรือรหัสผ่านไม่ถูกต้อง');
                }

                // ตรวจสอบสถานะการใช้งาน
                const allowedStatus = ['ปฏิบัติงาน', 'ยังศึกษาอยู่', 'active', '', undefined, null];
                if (x.st && !allowedStatus.includes(String(x.st).trim())) {
                    return err('สถานะ "' + x.st + '" ไม่สามารถเข้าสู่ระบบได้ กรุณาติดต่อผู้ดูแลระบบ');
                }

                ME = { ...x, role: role };
                try { sessionStorage.setItem('nsys_me', JSON.stringify(ME)); } catch(e) {}
                log('เข้าสู่ระบบ (' + (role === 'student' ? 'นักศึกษา' : role === 'admin' ? 'ผู้ดูแลระบบ' : 'อาจารย์') + ')');
                go('dash');
            });
        }

            let res;
            await busy(async () => {
                try { res = await fetch(c.url, { method: 'POST', body: JSON.stringify({ token: c.tk, action: 'reqOTP', u: u.trim() }) }).then(r => r.json()); } catch(e) { res = { ok: false, error: e.message }; }
            });
            
            if (!res.ok) return err(res.error);
            
            const { value: form } = await Swal.fire({
                title: 'ยืนยันรหัส OTP',
                html: `<p class="text-sm text-gray-500 mb-3">ระบบส่งรหัสไปที่อีเมล: <b>${res.email}</b><br>รหัสมีอายุ 10 นาที</p>

                focusConfirm: false, showCancelButton: true, confirmButtonText: 'เปลี่ยนรหัสผ่าน', confirmButtonColor: '#3BB489',
                preConfirm: () => [document.getElementById('sw-otp').value.trim(), document.getElementById('sw-pass').value.trim()]
            });
            
            if (!form || !form[0] || !form[1]) return;
            await busy(async () => {
                try {
                    const targetU = res.u || u.trim();
                    const conf = await fetch(c.url, { method: 'POST', body: JSON.stringify({ token: c.tk, action: 'confirmOTP', u: targetU, code: form[0], newPass: form[1] }) }).then(r => r.json());

                } catch(e) { err(e.message); }
            });
        }

                $('#mn').innerHTML = box(head('ผลประเมินของฉัน') + dt('myeval', [['code', 'รายวิชา'], ['type', 'ประเภท'], ['teacher', 'อาจารย์'], ['score', 'คะแนนเฉลี่ย', r => r.score.toFixed(2)], ['date', 'วันที่ส่ง'], ['comment', 'ข้อเสนอแนะ', r => r.comment ? r.comment.substring(0,50)+'...' : '-']], items));
            },
            myeval() {
                const rows = (D.docs || []).filter(d => d.uid === ME.u);
                if (!rows.length) {
                    $('#mn').innerHTML = box('<div class="text-center text-gray-500 py-8">ยังไม่มีแบบประเมินที่ส่งแล้ว</div>');
                    return;
                }
                const items = rows.map(d => ({
                    code: d.courseCode, name: d.course || d.courseCode, type: d.type,
                    teacher: d.tname || 'รายวิชา', score: (d.score || 0).toFixed(2),
                    date: d.date, comment: (d.comment || '-').substring(0, 40)
                }));
                const total = rows.length, avg = (rows.reduce((s,d) => s + (d.score || 0), 0) / total).toFixed(2);
                $('#mn').innerHTML = box(`<div class="font-semibold mb-2">ผลประเมินของฉัน (${total} รายการ, เฉลี่ย ${avg})</div>`) +
                    box(dt('myeval', [['code','รายวิชา',r=>esc(r.code+' '+r.name)], ['type','ประเภท',r=>badge(r.type,r.type.includes('วิชา')?'#0288D1':'#F57C00')], ['teacher','อาจารย์',r=>esc(r.teacher)], ['score','คะแนน',r=>r.score], ['date','วันที่',r=>r.date], ['comment','ข้อเสนอแนะ',r=>esc(r.comment)]], items));
            },

            treport() {
                const myCodes = new Set((D.teaching || []).filter(t => tI(t) === ME.u).map(t => eC(t).toUpperCase()));
                if (!myCodes.size) {
                    $('#mn').innerHTML = box('<div class="text-center text-gray-500 py-8">คุณไม่ได้มอบหมายสอนรายวิชาใด</div>');
                    return;
                }
                let rows = (D.docs || []).filter(d => myCodes.has((d.courseCode || '').toUpperCase()));
                const f = S.f || '';
                if (f) rows = rows.filter(d => d.courseCode === f);
                
                if (!rows.length) {
                    $('#mn').innerHTML = box(head('ผลประเมินรายวิชาที่สอน', 
                        `<select class="inp !w-60" onchange="S.f=this.value;V.treport()"><option value="">— ทั้งหมด —</option>${[...myCodes].map(c => `<option ${c===f?'selected':''}>${c}</option>`).join('')}</select>`) +
                        '<div class="text-center text-gray-500 py-8">ยังไม่มีการประเมิน</div>');
                    return;
                }
                
                const byCode = {};
                rows.forEach(d => {
                    const k = d.courseCode; (byCode[k] = byCode[k] || []).push(d);
                });
                
                const summary = Object.entries(byCode).map(([code, docs]) => {
                    const scores = docs.map(d => d.score || 0).filter(s => s > 0);
                    const avg = scores.length ? (scores.reduce((a,b)=>a+b)/scores.length).toFixed(2) : 0;
                    return { code, course: courseOf(code).name, n: docs.length, avg, min: Math.min(...scores), max: Math.max(...scores) };
                });
                
                $('#mn').innerHTML = box(head('ผลประเมินรายวิชาที่สอน', 
                    `<select class="inp !w-60" onchange="S.f=this.value;V.treport()"><option value="">— ทั้งหมด —</option>${[...myCodes].map(c => `<option ${c===f?'selected':''}>${c}</option>`).join('')}</select>`)) +
                    box(dt('tsumm', [['code','รายวิชา'], ['course','ชื่อ'], ['n','จำนวน'], ['avg','เฉลี่ย'], ['min','ต่ำสุด'], ['max','สูงสุด']], summary)) +
                    box('<div class="font-semibold mb-2">รายละเอียดแต่ละผู้ตอบ</div>' + dt('tdet', [['uid','ชื่อนักศึกษา',r=>esc(uName(r.uid))], ['type','ประเภท'], ['score','คะแนน',r=>(r.score||0).toFixed(2)], ['comment','ข้อเสนอแนะ',r=>esc((r.comment||'-').substring(0,30))], ['date','วันที่']], rows));
            }
        });

            
        const tDone = (code, sem, yr, tid) => (D.docs || []).some(d => d.uid == ME.u && d.type == 'ประเมินอาจารย์ผู้สอน' && docCode(d) == code && d.sem == sem && d.year == yr && String(d.teacher || '') == String(tid));
        // รายชื่ออาจารย์ของวิชา: เลือกประเมินทีละท่าน เสร็จแล้วกลับมาที่รายชื่อ
        async function teacherList(code, sem, yr, teachers) {
            const c = courseOf(code);
            while (true) {
                const rows = teachers.map(tid => ({ tid, done: tDone(code, sem, yr, tid), draft: hasDraft(code, 'ประเมินอาจารย์ผู้สอน', sem, yr, tid) })), k = rows.filter(r => r.done).length;
                if (k === rows.length) break;
                let chosen = null;
                await Swal.fire({
                    title: 'เลือกอาจารย์ที่จะประเมิน', width: 'min(780px, 96vw)', customClass: { popup: 'eval-popup' }, showConfirmButton: false, showCancelButton: true, cancelButtonText: 'ปิด',
                    html: `<div class="text-left"><div class="p-4 rounded-xl mb-3 text-base" style="background:#e8f6f0"><b class="text-lg">${esc(code)} ${esc(c.name)}</b><br>ภาคการศึกษา ${esc(sem)}/${esc(yr)} · ประเมินแล้ว <b>${k}/${rows.length}</b> ท่าน</div><div class="text-sm text-gray-500 mb-2">ประเมินทีละท่าน และให้คะแนนแต่ละท่านแยกกัน ส่งแล้วจะกลับมาที่รายชื่อนี้</div><div class="border rounded-xl">${rows.map(r => `<div class="flex items-center justify-between gap-3 px-4 py-3 border-b" style="${r.done ? 'background:#f9fafb' : ''}"><span class="text-lg" style="${r.done ? 'color:#9ca3af' : ''}">${esc(uName(r.tid))}${r.draft && !r.done ? ' <small style="color:#F57C00">· มีร่างค้างอยู่</small>' : ''}</span>${r.done ? '<span class="font-semibold" style="color:#3BB489;white-space:nowrap">✓ ประเมินแล้ว</span>' : `<button type="button" class="btn pick-t" data-t="${esc(r.tid)}" style="background:#3BB489;white-space:nowrap">ประเมิน</button>`}</div>`).join('')}</div></div>`,
                    didOpen: () => document.querySelectorAll('.pick-t').forEach(b => b.onclick = () => { chosen = b.dataset.t; Swal.close(); })
                });
                if (!chosen) break;
                await doEval(code, 'ประเมินอาจารย์ผู้สอน', [chosen], sem, yr);
            }
            refreshMine();
        }
        // ===== บันทึกร่างอัตโนมัติ (เก็บในเครื่องของนักศึกษา แยกตามผู้ใช้/วิชา/ปี/อาจารย์) =====
        const DK = (code, type, sem, yr, teacher) => 'nsys_draft|' + [ME.u, code, type, sem, yr, teacher || ''].join('|');
        const draftLoad = k => { try { const d = JSON.parse(localStorage.getItem(k)); if (d && Date.now() - d.ts < 30 * 864e5) return d; if (d) localStorage.removeItem(k); } catch (e) { } return null; };
        const draftSave = (k, ans, comment) => { try { if (!Object.keys(ans).length && !comment) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify({ ts: Date.now(), ans, comment })); } catch (e) { } };
        const draftClear = k => { try { localStorage.removeItem(k); } catch (e) { } };
        const hasDraft = (code, type, sem, yr, teacher) => !!draftLoad(DK(code, type, sem, yr, teacher));
        // รายการที่นักศึกษาต้องประเมิน (ใช้ร่วมกันระหว่างแดชบอร์ดและหน้า "แบบประเมินของฉัน")
        const myTasks = () => {
            const T = [];
            (D.enrollments || []).filter(e => eS(e) === ME.u).forEach(e => {
                const code = eC(e), sem = eSem(e), yr = eY(e), nm = courseOf(code).name;
                T.push({ code, name: nm, sem, yr, type: 'ประเมินรายวิชา', teachers: [], tname: '-', units: 1, got: D.docs.some(d => d.uid == ME.u && d.type == 'ประเมินรายวิชา' && docCode(d) == code && d.sem == sem && d.year == yr) ? 1 : 0, draft: hasDraft(code, 'ประเมินรายวิชา', sem, yr, '') });
                const teachers = (D.teaching || []).filter(t => eC(t) == code && (!eSem(t) || eSem(t) == sem) && (!eY(t) || eY(t) == yr)).map(t => tI(t)).filter((x, i, a) => x && a.indexOf(x) === i);
                if (teachers.length) T.push({ code, name: nm, sem, yr, type: 'ประเมินอาจารย์ผู้สอน', teachers, tname: teachers.length + ' ท่าน', units: teachers.length, got: teachers.filter(tid => tDone(code, sem, yr, tid)).length, draft: teachers.some(tid => !tDone(code, sem, yr, tid) && hasDraft(code, 'ประเมินอาจารย์ผู้สอน', sem, yr, tid)) });
            });
            T.forEach((r, i) => { r.i = i; r.done = r.got >= r.units; });
            MYT = T; return T;
        };
        const refreshMine = () => V[CUR === 'dash' ? 'dash' : 'docs']();
        // ===== อีเมลของฉัน (ใช้รับ OTP เมื่อลืมรหัสผ่าน) =====
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const myEmail = () => String(((D.users || []).concat(D.admins || []).find(x => String(x.u) === String(ME.u)) || ME).email || ME.email || '').trim();
        async function editMyEmail() {
            const cur = myEmail();
            const r = await Swal.fire({
                title: 'อีเมลของฉัน', width: 'min(520px, 96vw)', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#3BB489', focusConfirm: false,
                html: `<div class="text-left text-sm text-gray-600 mb-2">ใช้รับรหัส OTP เมื่อลืมรหัสผ่าน<br>${cur ? 'อีเมลปัจจุบัน: <b>' + esc(cur) + '</b>' : '<b style="color:#F57C00">ยังไม่ได้ลงทะเบียนอีเมล</b>'}</div><input id="em_new" type="email" class="swal2-input" placeholder="อีเมลใหม่" value="${esc(cur)}"><input id="em_pw" type="password" class="swal2-input" placeholder="รหัสผ่านปัจจุบัน (เพื่อยืนยันตัวตน)">`,
                preConfirm: () => {
                    const em = document.getElementById('em_new').value.trim().toLowerCase(), pw = document.getElementById('em_pw').value;
                    if (!EMAIL_RE.test(em)) { Swal.showValidationMessage('รูปแบบอีเมลไม่ถูกต้อง'); return false; }
                    if (pw !== ME.p) { Swal.showValidationMessage('รหัสผ่านไม่ถูกต้อง'); return false; }
                    if ((D.users || []).concat(D.admins || []).some(x => String(x.u) !== String(ME.u) && String(x.email || '').trim().toLowerCase() === em)) { Swal.showValidationMessage('อีเมลนี้ถูกใช้งานโดยบัญชีอื่นแล้ว'); return false; }
                    return em;
                }
            });
            if (!r.isConfirmed || !r.value) return;
            const em = r.value; let bad = '';
            await busy(async () => {
                if (ME.role === 'admin') { const a = D.admins.find(x => String(x.u) === String(ME.u)); if (a) a.email = em; ME.email = em; save('admins'); }
                else {
                    const rs = await post({ action: 'setEmail', u: ME.u, pw: ME.p, email: em });
                    if (!rs.ok) { bad = (rs.error || 'ไม่สำเร็จ') + ' (หากเพิ่งอัปเดตระบบ ให้ตรวจว่า Code.gs เป็นเวอร์ชันล่าสุดและ Deploy แล้ว)'; return; }
                    const u = D.users.find(x => String(x.u) === String(ME.u)); if (u) u.email = em; ME.email = em; save('users');
                }
                try { sessionStorage.setItem('nsys_me', JSON.stringify(ME)); } catch (e) { }
                log('บันทึกอีเมลของตนเอง');
            });
            if (bad) return err(bad);
            ok('บันทึกอีเมลเรียบร้อยแล้ว'); if (CUR === 'dash') V.dash();
        }
        let MYT = [];
        const doEvalI = i => { const r = MYT[i]; if (!r) return; return r.type === 'ประเมินรายวิชา' ? doEval(r.code, r.type, [], r.sem, r.yr) : teacherList(r.code, r.sem, r.yr, r.teachers); };
        async function doEval(code, type, teachers, sem, yr) {
            // ตรวจสอบว่าผู้ใช้ลงทะเบียนวิชานี้จริงๆ
            const enrolledHere = (D.enrollments || []).some(e => eS(e) === ME.u && eC(e).toUpperCase() === code.toUpperCase() && eSem(e) === sem && eY(e) === yr);
            if (!enrolledHere) return err('คุณไม่ได้ลงทะเบียนวิชานี้ในภาคการศึกษา ' + sem + '/' + yr);

            const c = courseOf(code), isC = type === 'ประเมินรายวิชา';
            const qs = qsFor(code, isC, yr);
            if (!qs.length) return err('ยังไม่มีคำถามประเมินสำหรับรายการนี้ กรุณาติดต่อผู้ดูแลระบบ');

            teachers = Array.isArray(teachers) ? teachers : [];
            // ประเมินอาจารย์: ทำทีละท่านเท่านั้น (ให้คะแนนแต่ละท่านแยกกัน) → ถ้าส่งมาหลายคนให้ไปเลือกจากรายชื่อ
            if (!isC && teachers.length > 1) return teacherList(code, sem, yr, teachers);
            const selectedTeachers = isC ? [] : teachers;

            // แบ่งหน้าตามประเภทคำถาม: โครงสร้างรายวิชา → ก่อนเรียน → หลังเรียน (ประเภทอื่นต่อท้าย)
            const ORDER = ['โครงสร้างรายวิชา', 'คำถามก่อนเรียน', 'คำถามหลังเรียน'], byT = {};
            qs.forEach(q => { const k = String(q.t || '').trim() || 'คำถามทั่วไป'; (byT[k] = byT[k] || []).push(q); });
            const keys = isC ? [...ORDER.filter(k => byT[k]), ...Object.keys(byT).filter(k => !ORDER.includes(k))] : Object.keys(byT);
            const pages = keys.map(k => ({ name: isC ? k : 'การสอนของอาจารย์ผู้สอน', qs: byT[k] }));

            const dk = DK(code, type, sem, yr, isC ? '' : (selectedTeachers[0] || ''));
            const ans = {}; let comment = '', restored = false;
            const dr = draftLoad(dk);
            if (dr) { qs.forEach(q => { const s = dr.ans && dr.ans[q.id]; if (s && s.v && s.t === qText(q)) ans[q.id] = s.v; }); comment = dr.comment || ''; restored = !!Object.keys(ans).length || !!comment; }
            const persist = () => draftSave(dk, Object.fromEntries(Object.entries(ans).map(([id, v]) => [id, { v, t: qText(qs.find(q => q.id == id) || {}) }])), comment);
            const collect = pg => { pg.qs.forEach(q => { const el = document.querySelector(`input[name="q_${q.id}"]:checked`); if (el) ans[q.id] = +el.value; else delete ans[q.id]; }); const cm = $('#dcomment'); if (cm) comment = cm.value; persist(); };
            const pageHtml = (pg, i, last) => `<div class="text-left">
                <div class="p-4 rounded-xl mb-4 text-base" style="background:#e8f6f0"><b class="text-lg">${esc(code)} ${esc(c.name)}</b><br>ภาคการศึกษา ${esc(sem)}/${esc(yr)}${selectedTeachers.length ? `<br><span class="text-lg font-semibold" style="color:#4A2C6D">👩‍🏫 อาจารย์ผู้ถูกประเมิน: ${esc(selectedTeachers.map(t => uName(t)).join(', '))}</span>` : ''}</div>
                <div class="flex flex-wrap items-center justify-between gap-2 mb-1"><h3 class="text-xl font-bold" style="color:#3BB489">${esc(pg.name)}</h3><span class="text-sm text-gray-500">หน้า ${i + 1}/${pages.length}</span></div>
                ${note ? '<div class="p-3 rounded-lg mb-2 text-sm" style="background:#fff7e6;color:#8a5a00">💾 กู้คืนคำตอบที่บันทึกร่างไว้ให้แล้ว ตรวจสอบและทำต่อได้เลย</div>' : ''}<div class="text-sm text-gray-500 mb-1">เลือกระดับคะแนน 5 = มากที่สุด ... 1 = น้อยที่สุด · ระบบบันทึกร่างให้อัตโนมัติ ปิดหน้าต่างแล้วกลับมาทำต่อได้</div>
                <div class="border rounded-xl">${pg.qs.map(q => `<div class="eval-row"><div class="eval-q">${esc(qText(q))}</div><div class="eval-rt">${[5, 4, 3, 2, 1].map(v => `<label class="rt"><input type="radio" name="q_${q.id}" value="${v}" ${ans[q.id] == v ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div></div>`).join('')}</div>
                ${last ? `<label class="text-base font-semibold mt-4 block">✍️ ข้อเสนอแนะเพิ่มเติม</label><textarea id="dcomment" class="inp mt-1" style="font-size:1.05rem" rows="4">${esc(comment)}</textarea>` : ''}</div>`;

            let pi = pages.findIndex(pg => pg.qs.some(q => !ans[q.id])); if (pi < 0) pi = pages.length - 1;
            let note = restored;
            while (pi < pages.length) {
                const pg = pages[pi], last = pi === pages.length - 1;
                const r = await Swal.fire({
                    title: type, width: 'min(1100px, 96vw)', customClass: { popup: 'eval-popup' }, allowOutsideClick: false,
                    progressSteps: pages.length > 1 ? pages.map((_, i) => String(i + 1)) : [], currentProgressStep: pi,
                    showCancelButton: true, showDenyButton: pi > 0,
                    confirmButtonText: last ? 'ส่งแบบประเมิน' : 'ถัดไป ›', denyButtonText: '‹ ย้อนกลับ', cancelButtonText: 'ยกเลิก',
                    confirmButtonColor: '#3BB489', denyButtonColor: '#6b7280',
                    html: pageHtml(pg, pi, last),
                    didOpen: () => { document.querySelectorAll('.eval-row input').forEach(x => x.addEventListener('change', () => collect(pg))); const cm = $('#dcomment'); if (cm) cm.addEventListener('input', () => collect(pg)); },
                    preConfirm: () => { collect(pg); const miss = pg.qs.filter(q => !ans[q.id]); if (miss.length) { Swal.showValidationMessage('กรุณาตอบให้ครบทุกข้อในหน้านี้ (เหลืออีก ' + miss.length + ' ข้อ)'); return false; } return true; },
                    preDeny: () => { collect(pg); return true; }
                });
                note = false; if (r.isConfirmed) pi++; else if (r.isDenied) pi--; else return;
            }

            const a = qs.map(q => ({ q: q.id, v: ans[q.id], t: qText(q) })), score = +(a.reduce((s, x) => s + x.v, 0) / a.length).toFixed(2);
            // รายวิชา: ส่ง 1 ชุด (ไม่ระบุอาจารย์) | ประเมินอาจารย์: ส่งแยกต่ออาจารย์แต่ละคน เพื่อให้ระบบตรวจไม่ซ้ำ
            const targets = isC ? [''] : selectedTeachers, sent = [], failed = [];
            for (const teacher of targets) {
                const tn = teacher ? uName(teacher) : '';
                const doc = { id: Date.now() + Math.random(), uid: ME.u, name: ME.n, date: new Date().toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok' }), sem, year: yr, type, course: code + (c.name ? ' - ' + c.name : ''), courseCode: code, teacher, tname: tn, score, answers: a, comment };
                let res; await busy(async () => { res = await post({ action: 'submitDoc', doc }); });
                if (!res.ok) failed.push((tn || code) + ': ' + (res.error || 'ไม่สำเร็จ')); else sent.push(doc);
            }
            D.docs.push(...sent); if (sent.length) draftClear(dk); save();
            if (sent.length) log('ส่งแบบประเมิน: ' + type + ' ' + code + ' (' + sent.length + ' รายการ)');
            if (failed.length) { await err('ส่งสำเร็จ ' + sent.length + ' รายการ แต่ล้มเหลว: ' + failed.join(', ')); return refreshMine(); }
            ok('ส่งแบบประเมินเรียบร้อยแล้ว'); refreshMine();
        }

        // แอดมิน: ติดตามผลการประเมิน + ตรวจความสัมพันธ์ของข้อมูลระหว่างชีต
        V.track = () => {
            const g = {}; (D.enrollments || []).forEach(e => { const k = [eC(e), eSem(e), eY(e)].join('|'); (g[k] = g[k] || { code: eC(e), sem: eSem(e), yr: eY(e), st: [] }).st.push(eS(e)); });
            const rows = S.trk = Object.values(g).map((x, i) => {

        function qf() { 
            const evalType = $('#dt').value;
            const isCourse = evalType == 'ประเมินรายวิชา';
            $('#dtw').classList.toggle('hidden', isCourse);

            // ดึง course_code จากรายวิชาที่เลือก
            const dcEl = $('#dc');
            const selectedOpt = dcEl && dcEl.selectedOptions && dcEl.selectedOptions[0];
            const selectedCode = selectedOpt ? (selectedOpt.dataset.code || dcEl.value.split(' - ')[0] || '').trim() : '';

            // เติม ภาคการศึกษา และ ปีการศึกษา อัตโนมัติจากข้อมูล enrollments หรือ teaching
            if (selectedCode) {
                let sem = '', yr = '';
                const enr = (D.enrollments || []).find(e => String(e.courseCode || e.course_code || '').trim().toUpperCase() === selectedCode.toUpperCase());
                if (enr) { sem = enr.semester || enr['ภาคเรียน'] || enr['ภาคการศึกษา']; yr = enr.academic_year || enr.academicYear || enr['ปีการศึกษา']; }
                if (!sem || !yr) {
                    const tch = (D.teaching || []).find(t => String(t.courseCode || t.course_code || '').trim().toUpperCase() === selectedCode.toUpperCase());
                    if (tch) { sem = sem || tch.semester || tch['ภาคเรียน']; yr = yr || tch.academic_year || tch.academicYear || tch['ปีการศึกษา']; }
                }
                if (sem) $('#ds').value = sem;
                if (yr) $('#dy').value = yr;
            }


            // อัปเดตรายชื่ออาจารย์ผู้สอน (เฉพาะที่สอนวิชานี้)
            const dtt = $('#dtt');
            if (dtt && !isCourse) {
                const normPos = u => (u.pos || '').toString().trim();
                let th = D.users.filter(u => normPos(u) !== 'นักศึกษา' && normPos(u) !== '' && (u.st || 'ปฏิบัติงาน') !== 'ลาออก');
                
                if (selectedCode && (D.teaching || []).length > 0) {
                    const teachingIds = D.teaching.filter(t => String(t.courseCode || t.course_code || t.course || '').trim().toUpperCase() === selectedCode.toUpperCase()).map(t => String(t.instructorId || t.instructor_id || t.u || t.teacher || '').trim());
                    if (teachingIds.length > 0) th = th.filter(u => teachingIds.includes(u.u));
                }
                
                const prevTeacher = dtt.value;
                dtt.innerHTML = th.map(t => `<option value="${t.u}">${t.n}</option>`).join('') || '<option value="">-- ไม่พบข้อมูลอาจารย์ผู้สอน --</option>';
                if (th.find(t => t.u === prevTeacher)) dtt.value = prevTeacher;
            }

            // กรองคำถาม
            const groups = {};
            const filtered = qsFor(selectedCode, isCourse, $('#dy') ? $('#dy').value : '');

            filtered.forEach(q => {
                const qType = String(q.t || '').trim();
                if (!groups[qType]) groups[qType] = [];
                groups[qType].push(q);
            });

            let html = '';
            const order = isCourse ? ['โครงสร้างรายวิชา', 'คำถามก่อนเรียน', 'คำถามหลังเรียน'] : ['อาจารย์'];

                    html += `<div class="mt-4 mb-2"><h3 class="font-bold text-sm border-b-2 inline-block pb-1" style="color: ${titleColor}; border-color: ${borderColor};">${type}</h3></div>`;

                        </div>`;
                    });
                }
            };

            order.forEach(type => renderGroup(type, '#3BB489', '#3BB489'));

        async function gsSave() {

            let bad = 0; await busy(async () => { try { if (!c.url) { GST('ยังไม่ได้เชื่อมต่อ', 0); return; } const j = await fetch(gurl(c)).then(r => r.json()); if (!j.ok) throw Error(j.error); GST('เชื่อมต่อสำเร็จ', 1); log('ตั้งค่า Google Sheet'); } catch (e) { bad = 1; GST('เชื่อมต่อไม่ได้: ' + e.message, 0); } });
            if (bad) err('เชื่อมต่อไม่ได้ ตรวจสอบ URL, Token และสิทธิ์ Web App'); V.gs();

        async function gsPull() { if (!cfg().url) return err('กรุณาตั้งค่า URL ก่อน'); if (!await cf('ข้อมูลในระบบจะถูกแทนที่ด้วยข้อมูลจาก Sheet')) return; let r, e0; await busy(async () => { try { r = await gpull(); } catch (e) { e0 = e; } }); if (e0) err('ดึงข้อมูลไม่สำเร็จ: ' + e0.message); else ok('ดึงข้อมูลแล้ว'); V.gs(); }
        async function gsOff() { if (!await cf('ยกเลิกการเชื่อมต่อ Google Sheet?')) return; try { localStorage.removeItem('nsys_gs'); } catch (e) { } GST('ยังไม่ได้เชื่อมต่อ', 0); log('ยกเลิกการเชื่อมต่อ Google Sheet'); V.gs(); }


        // ===== PWA & Offline Support =====
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'eval-v1';
                const urlsToCache = ['/', '/index.html'];
                
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE).then(cache => cache.addAll(urlsToCache)).then(() => self.skipWaiting()));
                });
                
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(names => Promise.all(names.filter(n => n !== CACHE).map(n => caches.delete(n)))).then(() => self.clients.claim()));
                });
                
                self.addEventListener('fetch', e => {
                    if (e.request.method !== 'GET') return;
                    e.respondWith(
                        caches.match(e.request).then(r => r || fetch(e.request).then(r => {
                            if (!r || r.status !== 200) return r;
                            const cache = caches.open(CACHE);
                            cache.then(c => c.put(e.request, r.clone()));
                            return r;
                        }).catch(() => new Response('Offline', { status: 503 })))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl, { scope: './' }).then(() => {
                console.log('Service Worker registered');
            }).catch(err => console.warn('SW error:', err));
        }
        
        // Local storage data sync for offline
        const syncData = () => {

            } catch (e) {
                console.warn('Storage quota exceeded:', e);
            }
        };
        
        window.addEventListener('online', () => { notify('กลับออนไลน์ - ซิงก์ข้อมูล', 'success'); gpull().catch(e => console.warn('Sync error:', e)); });
        window.addEventListener('offline', () => { notify('ออฟไลน์ - ข้อมูลบันทึกในอุปกรณ์', 'info', 3000); });

            if (cfg().url && !cfg().url.includes('วาง_WEB_APP')) {
