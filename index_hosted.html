<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>ระบบประเมินการจัดการเรียนการสอน หลักสูตรพยาบาลศาสตรมหาบัณฑิต</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --g: #3BB489; --g2: #76C58C; --bg: #f4f8f6; --tx: #1f2937; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--tx); }
        .dec { position: relative; overflow: hidden; }
        .dec:before, .dec:after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); }
        .dec:before { width: 130px; height: 130px; right: -35px; top: -40px; }
        .dec:after { width: 90px; height: 90px; right: 30px; bottom: -45px; }
        .sk { background: linear-gradient(90deg, #e5ece9 25%, #f3f7f5 50%, #e5ece9 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; }
        @keyframes sh { to { background-position: -200% 0; } }
        .sp { width: 44px; height: 44px; border: 4px solid #d6efe5; border-top-color: var(--g); border-radius: 50%; animation: r .8s linear infinite; }
        @keyframes r { to { transform: rotate(360deg); } }
        .mi { display: flex; gap: .7rem; align-items: center; padding: .7rem 1rem; border-radius: 12px; color: #4b5563; cursor: pointer; transition: .2s; }
        .mi:hover { background: #e8f6f0; }
        .mi.on { background: linear-gradient(135deg, #3BB489, #76C58C); color: #fff; box-shadow: 0 6px 14px #3bb48955; }
        .inp { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: .55rem .8rem; outline: none; }
        .inp:focus { border-color: var(--g); box-shadow: 0 0 0 3px #3bb48922; }
        .btn { padding: .5rem 1rem; border-radius: 10px; color: #fff; font-weight: 500; transition: .2s; cursor: pointer; border: none; }
        .btn:hover { filter: brightness(.95); transform: translateY(-1px); }
        th { cursor: pointer; white-space: nowrap; }
        .swal2-popup { font-family: 'Sarabun'; }
        .likert-btn { display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s ease; user-select: none; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; }
        .likert-btn:hover { background: #e8f6f0; border-color: #3BB489; }
        .likert-btn:has(input:checked), .likert-btn.active { background: linear-gradient(135deg, #3BB489, #76C58C) !important; color: #fff !important; border-color: #3BB489 !important; font-weight: 600; box-shadow: 0 3px 8px rgba(59,180,137,.35); transform: translateY(-1px); }
        .likert-btn input { position: absolute; opacity: 0; pointer-events: none; }
        :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
        
        @media print {
            body * { visibility: hidden; }
            #report-printable, #report-printable * { visibility: visible; }
            #report-printable { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 1rem; }
            .no-print, header, aside, .btn, .swal2-container { display: none !important; }
            .bg-white { box-shadow: none !important; border: 1px solid #ddd; break-inside: avoid; }
            canvas { max-width: 100% !important; }
            .grid { display: block !important; }
            .grid > div { margin-bottom: 20px; }
            ::-webkit-scrollbar { display: none; }
        }
    </style>
</head>
<body>
    <div id="splash" class="fixed inset-0 z-[100] flex flex-col items-center justify-center text-white dec" style="background:linear-gradient(135deg,#3BB489,#76C58C 60%,#AED581)">
        <div class="sp !border-white/30 !border-t-white mb-5"></div>
        <div class="text-xl font-semibold text-center px-4">ระบบประเมินการจัดการเรียนการสอน</div>
        <div class="opacity-80 mt-1">สถาบันพระบรมราชชนก</div>
    </div>
    <div id="busy" class="hidden fixed inset-0 z-[90] bg-white/70 items-center justify-center">
        <div class="sp"></div>
    </div>
    <div id="app"></div>
    
    <script>
        window.addEventListener('error', e => { const sp = document.getElementById('splash'); if (sp && sp.style.display != 'none') { const d = document.createElement('div'); d.style.cssText = 'margin-top:16px;padding:0 20px;font-size:12px;text-align:center;max-width:600px'; d.textContent = 'เกิดข้อผิดพลาด: ' + e.message + ' (บรรทัด ' + e.lineno + ')'; sp.appendChild(d); } });
        const $ = s => document.querySelector(s), KEY = 'nsys1';
        const LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#3BB489"/><path d="M50 22v56M22 50h56" stroke="#fff" stroke-width="14" stroke-linecap="round"/></svg>');
        const seed = {
            inst: { name: 'สถาบันพระบรมราชชนก', org: 'คณะพยาบาลศาสตร์ สถาบันพระบรมราชชนก', logo: LOGO },
            admins: [{ id: 1, u: 'admin', p: 'admin1234', n: 'ผู้ดูแลระบบ', st: 'ปฏิบัติงาน' }],
            positions: ['อาจารย์', 'นักศึกษา'],
            users: [
                { id: 1, u: 't01', p: '1234', n: 'ผศ.ดร.สมใจ ใจดี', email: '', pos: 'อาจารย์', st: 'ปฏิบัติงาน' },
                { id: 2, u: 's01', p: '1234', n: 'นางสาวสุดา ตั้งใจ', email: '', pos: 'นักศึกษา', st: 'ปฏิบัติงาน' },
                { id: 3, u: 's02', p: '1234', n: 'นายสมศักดิ์ รักเรียน', email: '', pos: 'นักศึกษา', st: 'ปฏิบัติงาน' },
                { id: 4, u: 's03', p: '1234', n: 'นางสาวกานดา วิริยะ', email: '', pos: 'นักศึกษา', st: 'ปฏิบัติงาน' }
            ],
            courses: [
                { id: 1, code: 'พย.ม.601', name: 'ทฤษฎีและการวิจัยทางการพยาบาลขั้นสูง', credits: '3(3-0-6)', teacher: 't01', tname: 'ผศ.ดร.สมใจ ใจดี', sem: '1', year: '2567' },
                { id: 2, code: 'พย.ม.602', name: 'ภาวะผู้นำและการจัดการทางการพยาบาล', credits: '3(2-2-5)', teacher: 't01', tname: 'ผศ.ดร.สมใจ ใจดี', sem: '1', year: '2567' },
                { id: 3, code: 'พย.ม.603', name: 'เภสัชวิทยาและพยาธิสรีรวิทยาขั้นสูง', credits: '3(3-0-6)', teacher: 't01', tname: 'ผศ.ดร.สมใจ ใจดี', sem: '2', year: '2567' },
                { id: 4, code: 'พย.ม.604', name: 'การปฏิบัติการพยาบาลขั้นสูง 1', credits: '3(0-6-3)', teacher: 't01', tname: 'ผศ.ดร.สมใจ ใจดี', sem: '2', year: '2567' }
            ],
            qs: [
                { id: 1, t: 'CLO', q: 'CLO 1: ท่านสามารถอธิบายแนวคิดทฤษฎีทางการพยาบาลขั้นสูงและหลักฐานเชิงประจักษ์ได้' },
                { id: 2, t: 'CLO', q: 'CLO 2: ท่านสามารถประยุกต์ใช้วิธีการวิจัยและสถิติในการแก้ปัญหาทางการพยาบาลได้' },
                { id: 3, t: 'CLO', q: 'CLO 3: ท่านสามารถวิเคราะห์ปัญหาและตัดสินใจเชิงคลินิกอย่างมีจริยธรรมได้' },
                { id: 4, t: 'CLO', q: 'CLO 4: ท่านสามารถประยุกต์ใช้เทคโนโลยีดิจิทัลและสารสนเทศทางการพยาบาลได้' },
                { id: 5, t: 'อาจารย์', q: 'อาจารย์ชี้แจงวัตถุประสงค์ แผนการสอน และเกณฑ์การประเมินผลชัดเจน' },
                { id: 6, t: 'อาจารย์', q: 'อาจารย์จัดกิจกรรมการเรียนรู้ที่กระตุ้นการคิดวิเคราะห์และการอภิปราย' },
                { id: 7, t: 'อาจารย์', q: 'อาจารย์ให้คำปรึกษาและข้อเสนอแนะเพื่อพัฒนาการเรียนรู้อย่างสม่ำเสมอ' }
            ],
            docs: [], logs: []
        };
        
        let D; try { D = JSON.parse(localStorage.getItem(KEY)) || seed; } catch (e) { D = seed; }
        if (!D.courses || !D.courses.length) D.courses = seed.courses;
        let NOSYNC = 0, gt, GSM = 'ยังไม่ได้เชื่อมต่อ';
        
        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { }; if (!NOSYNC) gpush(); };
        const cfg = () => { 
            try { const saved = JSON.parse(localStorage.getItem('nsys_gs')); if (saved && saved.url) return saved; } catch (e) { } 
            return { url: 'https://script.google.com/macros/s/AKfycbz9ffLuppfUGOWtdKtUi7A9-H9WSzODhH8H97APynWoxF-TAWboBITClz433QEtODVr/exec', tk: 'nursing_master_2024' }; 
        };
        const GST = (m, o) => { GSM = m; const e = $('#gst'); if (e) e.innerHTML = badge(m, o ? '#3BB489' : '#EF5350'); };
        const gurl = c => c.url + (c.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(c.tk || '');
        const snap = () => (ME && ME.role != 'admin') ? { docs: D.docs, logs: D.logs.slice(0, 300) } : ({
            inst: [{ ...D.inst, logo: (D.inst.logo || '').length < 45000 ? D.inst.logo : '' }],
            positions: D.positions.map(name => ({ name })), admins: D.admins, users: D.users, 
            courses: D.courses || [],
            qs: D.qs, docs: D.docs, logs: D.logs.slice(0, 300)
        });
        
        function gpush(now) {
            const c = cfg(); if (!c.url || c.url.includes('วาง_WEB_APP_URL_')) return Promise.resolve(); clearTimeout(gt);
            const go = () => fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: c.tk, data: snap(), del: D.del || [] })
            }).then(r => r.json()).then(j => { if (!j.ok) throw Error(j.error); D.del = []; GST('ซิงก์ล่าสุด ' + new Date().toLocaleTimeString('th-TH'), 1); return 1;
            }).catch(e => { GST('ซิงก์ไม่สำเร็จ: ' + e.message, 0); return 0; });
            if (now) return go(); gt = setTimeout(go, 1500); return Promise.resolve();
        }
        
        async function gpull() {
            const c = cfg(); if (!c.url || c.url.includes('วาง_WEB_APP_URL_')) return false;
            const j = await fetch(gurl(c)).then(r => r.json()); if (!j.ok) throw Error(j.error); 
            const d = j.data; if (!d.admins.length && !d.users.length) return false;
            const N = a => a.map(x => ({ ...x, id: +x.id })); NOSYNC = 1;
            try {
                D.admins = N(d.admins); D.users = N(d.users); D.qs = normQs(d.qs); 
                D.docs = N(d.docs).map(x => ({ ...x, score: +x.score })); D.logs = N(d.logs); 
                if (d.courses && d.courses.length) D.courses = normCourses(d.courses);
                if (d.positions.length) D.positions = d.positions.map(x => x.name);
                if (d.inst[0]) D.inst = { ...D.inst, ...Object.fromEntries(Object.entries(d.inst[0]).filter(([k, v]) => v !== '')) };
                save();
            } finally { NOSYNC = 0; }
            GST('ดึงข้อมูลล่าสุด ' + new Date().toLocaleTimeString('th-TH'), 1); return true;
        }
        
        let ME = null, IP = 'ไม่ทราบ', S = {};
        fetch('https://api.ipify.org?format=json').then(r => r.json()).then(j => IP = j.ip).catch(() => { });
        
        const log = a => { D.logs.unshift({ id: Date.now(), t: new Date().toLocaleString('th-TH'), u: ME ? ME.n : '-', uid: ME ? ME.u : '-', a, ip: IP }); D.logs = D.logs.slice(0, 500); save(); };
        const nid = a => Math.max(0, ...a.map(x => x.id)) + 1;
        const normQs = a => { const bad = a.some(x => !+x.id) || new Set(a.map(x => +x.id)).size != a.length; return a.map((x, i) => { const { question_text, ...r } = x; return { ...r, id: bad ? i + 1 : +r.id, q: r.q ?? question_text ?? '', course_code: r.course_code || 'ALL' }; }); };
        const normCourses = a => { const bad = a.some(x => !+x.id) || new Set(a.map(x => +x.id)).size != a.length; return a.map((x, i) => { const { course_code, course_name, ...r } = x; return { ...r, id: bad ? i + 1 : +r.id, code: String(r.code ?? course_code ?? ''), name: r.name ?? course_name ?? '' }; }); };
        const ACTIVE = ['ปฏิบัติงาน', 'ยังศึกษาอยู่', ''], isOn = u => ACTIVE.includes(u.st || '');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const SALT = 'nsys-v2';
        const hp = async p => { p = String(p); if (p.startsWith('h$')) return p; try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + p)); return 'h$' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return p; } };
        let IDLE; const idleReset = () => { clearTimeout(IDLE); if (ME) IDLE = setTimeout(() => { ME = null; loginPage(); Swal.fire({ icon: 'info', title: 'หมดเวลาการใช้งาน', text: 'ออกจากระบบอัตโนมัติเนื่องจากไม่มีการใช้งาน 30 นาที', confirmButtonColor: '#3BB489' }); }, 30 * 60000); };
        ['click', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, idleReset, { passive: true }));
        const busy = async f => { $('#busy').style.display = 'flex'; await new Promise(r => setTimeout(r, 450)); try { return await f(); } finally { $('#busy').style.display = 'none'; } };
        const ok = (t) => Swal.fire({ icon: 'success', title: t, timer: 1400, showConfirmButton: false });
        const err = t => Swal.fire({ icon: 'error', title: t, confirmButtonColor: '#3BB489' });
        const cf = t => Swal.fire({ title: t, icon: 'warning', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#EF5350' }).then(r => r.isConfirmed);
        const badge = (t, c) => `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium text-white" style="background:${c}">${t}</span>`;
        const stB = s => badge(s, ACTIVE.includes(s) ? '#3BB489' : s == 'ลาออก' ? '#EF5350' : '#F57C00');
        const ico = (n) => `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${n}</svg>`;
        
        const I = { dash: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>', inst: '<path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6"/>', book: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15zM8 7h8M8 11h5"/>', adm: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', usr: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 100-6M22 20c0-3-2-5-4-5.5"/>', q: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17h.01"/>', doc: '<path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8zM14 3v5h5M9 13h6M9 17h6"/>', rep: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', log: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>', out: '<path d="M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4M16 17l5-5-5-5M21 12H9"/>', menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', lock: '<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>' };

        /* ---------- LOGIN / OTP ---------- */
        function loginPage() {
            $('#app').innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-4 dec" style="background:linear-gradient(135deg,#e8f6f0,#f4f8f6 50%,#eef7e2)">
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden w-full max-w-3xl md:flex">
                    <div class="md:w-1/2 p-8 text-white text-center dec flex flex-col items-center justify-center" style="background:linear-gradient(135deg,#3BB489,#76C58C)">
                        <img src="${D.inst.logo}" class="w-24 h-24 rounded-full bg-white p-1 object-contain mb-4 relative z-10">
                        <h1 class="font-bold text-lg relative z-10">ระบบประเมินการจัดการเรียนการสอน</h1>
                        <p class="mt-2 opacity-90 relative z-10">คณะพยาบาลศาสตร์</p>
                        <p class="opacity-90 relative z-10">สถาบันพระบรมราชชนก</p>
                    </div>
                    <div class="md:w-1/2 p-8">
                        <h2 class="text-2xl font-bold text-[#3BB489] mb-1">เข้าสู่ระบบ</h2>
                        <p class="text-sm text-gray-500 mb-5">สำหรับผู้ดูแลระบบและบุคลากร</p>
                        <label class="text-sm">ชื่อผู้ใช้</label>
                        <input id="lu" class="inp mb-3" autocomplete="username">
                        <label class="text-sm">รหัสผ่าน</label>
                        <input id="lp" type="password" class="inp mb-4" autocomplete="current-password" onkeydown="event.key=='Enter'&&doLogin()">
                        <button onclick="doLogin()" class="btn w-full mb-3" style="background:linear-gradient(135deg,#3BB489,#76C58C)">เข้าสู่ระบบ</button>
                        <div class="text-center"><a href="#" onclick="forgotPassword()" class="text-sm text-[#3BB489] hover:underline">ลืมรหัสผ่าน? (ขอ OTP)</a></div>
                    </div>
                </div>
            </div>`;
        }

        async function doLogin() {
            const u = $('#lu').value.trim(), p = $('#lp').value;
            await busy(async () => {
                if (cfg().url && !cfg().url.includes('วาง_WEB_APP_URL_')) { try { await Promise.race([gpull(), new Promise(r => setTimeout(r, 6000))]); } catch (e) { } }
                const ph = await hp(p), m = x => x.u == u && (x.p == ph || x.p == p);
                const a = D.admins.find(m), s = D.users.find(m);
                const x = a || s;
                if (!x) return err('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); if (x.p != ph) x.p = ph;
                if (!isOn(x)) return err('สถานะ "' + x.st + '" ไม่สามารถเข้าสู่ระบบได้');
                ME = { ...x, role: a ? 'admin' : (x.pos == 'นักศึกษา' ? 'student' : 'teacher') };
                log('เข้าสู่ระบบ');
                go('dash'); idleReset();
                if (['admin1234', '1234'].includes(p)) setTimeout(() => Swal.fire({ icon: 'warning', title: 'รหัสผ่านยังเป็นค่าเริ่มต้น', text: 'กรุณาเปลี่ยนรหัสผ่านเพื่อความปลอดภัย', confirmButtonColor: '#3BB489' }).then(() => changeMyPassword()), 800);
            });
        }
        
        async function forgotPassword() {
            const { value: u } = await Swal.fire({ title: 'ลืมรหัสผ่าน', input: 'text', inputLabel: 'กรุณากรอก "ชื่อผู้ใช้" ของคุณ', showCancelButton: true, confirmButtonText: 'ขอรหัส OTP', confirmButtonColor: '#3BB489' });
            if (!u) return;
            const c = cfg(); if (!c.url || c.url.includes('วาง_WEB_APP')) return err('ระบบยังไม่ได้ตั้งค่าเชื่อมต่อฐานข้อมูล');
            
            let res;
            await busy(async () => {

                title: 'ยืนยันรหัส OTP',

            if (st.k != null) rows = [...rows].sort((a, b) => String(a[st.k]).localeCompare(String(b[st.k]), 'th', { numeric: true }) * st.d);
            const pg = Math.max(1, Math.ceil(rows.length / st.n)); st.p = Math.min(st.p, pg); const sl = rows.slice((st.p - 1) * st.n, st.p * st.n);
            return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-[#e8f6f0] text-left">${cols.map(c => `<th class="p-3" onclick="srt('${id}','${c[0]}')">${c[1]} ⇅</th>`).join('')}${o.act ? '<th class="p-3 no-print">จัดการ</th>' : ''}</tr></thead><tbody>${sl.map(r => `<tr class="border-b hover:bg-gray-50">${cols.map(c => `<td class="p-3">${c[2] ? c[2](r) : esc(r[c[0]])}</td>`).join('')}${o.act ? `<td class="p-3 whitespace-nowrap no-print">${o.act(r)}</td>` : ''}</tr>`).join('') || `<tr><td colspan="9" class="p-6 text-center text-gray-400">ไม่พบข้อมูล</td></tr>`}</tbody></table></div><div class="flex justify-between items-center mt-3 text-sm no-print"><span>ทั้งหมด ${rows.length} รายการ</span><div class="flex gap-2 items-center"><button class="px-3 py-1 rounded-lg bg-gray-100" onclick="pgx('${id}',-1)">‹</button>${st.p}/${pg}<button class="px-3 py-1 rounded-lg bg-gray-100" onclick="pgx('${id}',1)">›</button></div></div>`;

        async function sendNotify(uid) {
            const u = D.users.find(x => x.id == uid);

            if (!text) return;

                try {
                    await fetch(c.url, { method: 'POST', body: JSON.stringify({ token: c.tk, action: 'notify', to: u.email, subject: 'แจ้งเตือนจากระบบประเมิน ' + D.inst.name, body: text }) });

        async function impCourse(i) {
            const f = i.files[0]; if (!f) return;
            await busy(async () => {
                const b = await f.arrayBuffer(), r = XLSX.utils.sheet_to_json(XLSX.read(b).Sheets[Object.keys(XLSX.read(b).Sheets)[0]], { header: 1 }).slice(1);
                if (!D.courses) D.courses = [];
                let n = 0;
                r.forEach(x => {
                    if (!x[0] || !x[1]) return;
                    const code = String(x[0]).trim();
                    const name = String(x[1]).trim();
                    const credits = String(x[2] || '');
                    const sem = String(x[3] || '1');
                    const year = String(x[4] || '2567');
                    const tname = String(x[5] || '');
                    const teachObj = D.users.find(u => u.pos == 'อาจารย์' && (u.n.includes(tname) || tname.includes(u.n)));
                    const teacher = teachObj ? teachObj.u : '';
                    const e = D.courses.find(z => z.code == code);
                    const obj = { code, name, credits, sem, year, teacher, tname: teachObj ? teachObj.n : tname };
                    if (e) Object.assign(e, obj); else D.courses.push({ id: nid(D.courses), ...obj });
                    n++;
                });
                save();
                log('นำเข้า Excel รายวิชา ' + n + ' รายการ');
                i.value = '';
            });
            ok('นำเข้าสำเร็จ');
            V.course();

        function qf() { 
            const t = $('#dt').value, isCourse = t == 'ประเมินรายวิชา';

            const qList = D.qs.filter(q => (isCourse ? q.t != 'อาจารย์' : q.t == 'อาจารย์') && (!q.course_code || q.course_code == 'ALL' || q.course_code == code));
            if (!qList.length) {
                $('#qq').innerHTML = '<p class="text-gray-400 text-sm py-4 text-center">ยังไม่มีข้อคำถามในหมวดหมู่นี้</p>';
                return;
            }
            $('#qq').innerHTML = qList.map((q, idx) => `
                <div class="p-2.5 mb-2 bg-gray-50/90 rounded-xl border border-gray-100 hover:border-emerald-200 transition">
                    <div class="text-xs sm:text-sm font-medium text-gray-800 mb-2 flex items-start gap-1.5">
                        <span class="font-bold text-gray-400">${idx + 1}.</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold text-white ${q.t == 'CLO' ? 'bg-[#0288D1]' : q.t == 'LLO' ? 'bg-[#F57C00]' : 'bg-[#4A2C6D]'}">${q.t}</span>
                        <span class="flex-1 leading-snug">${q.q}</span>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-1 sm:gap-2 likert-group">
                        ${[1, 2, 3, 4, 5].map(n => `
                            <label class="likert-btn flex-1 sm:flex-initial flex items-center justify-center gap-1 py-1.5 px-2.5 sm:px-3 rounded-lg border text-xs font-semibold cursor-pointer select-none">
                                <input type="radio" name="q_${q.id}" value="${n}" class="q-val hidden" data-qid="${q.id}" data-qt="${q.t}" data-qq="${q.q.replace(/"/g, '&quot;')}" onchange="this.closest('.likert-group').querySelectorAll('.likert-btn').forEach(b=>b.classList.remove('active'));this.closest('.likert-btn').classList.add('active')">
                                <span>${n}</span>
                                <span class="text-[9px] sm:hidden opacity-75">${['น้อยสุด', 'น้อย', 'กลาง', 'มาก', 'มากสุด'][n - 1]}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }


        /* ---------- Question bank (เพิ่ม/แก้ไข/ลบ/CSV) ---------- */
        async function cQ(id) {
            const o = D.qs.find(x => x.id == id), codes = ['ALL', ...(D.courses || []).map(c => c.code).filter(Boolean)];
            const v = await form(o ? 'แก้ไขคำถาม' : 'เพิ่มคำถาม', [
                { k: 't', l: 'ประเภท', o: ['CLO', 'LLO', 'โครงสร้างรายวิชา', 'อาจารย์'] },
                { k: 'course_code', l: 'ใช้กับรายวิชา (ALL = ทุกวิชา)', o: codes },
                { k: 'q', l: 'ข้อคำถาม' }], o ? { ...o, course_code: o.course_code || 'ALL' } : { course_code: 'ALL' });
            if (!v) return;
            await busy(async () => { if (o) Object.assign(o, v); else D.qs.push({ id: nid(D.qs), ...v }); save(); log((o ? 'แก้ไข' : 'เพิ่ม') + 'คำถามประเมิน'); });
            ok('สำเร็จ'); V.qs();
        }
        async function dQ(id) { if (!await cf('ลบคำถามนี้?')) return; await busy(async () => { D.qs = D.qs.filter(x => x.id != id); save(); log('ลบคำถามประเมิน'); }); ok('ลบแล้ว'); V.qs(); }
        function expQ() {
            const csv = ['course_code,t,q', ...D.qs.map(x => [x.course_code || 'ALL', x.t, x.q].map(cq).join(','))].join('\r\n');
            dl('questions.csv', new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' })); log('ดาวน์โหลดคำถาม CSV');
        }
        async function impQ(i) {
            const f = i.files[0]; if (!f) return; let bad = 0, n = 0;
            await busy(async () => {
                const w = XLSX.read(await f.text(), { type: 'string' }), rows = XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]], { header: 1 });
                const h = (rows[0] || []).map(x => String(x).trim()), ix = k => h.indexOf(k), iq = ix('q') >= 0 ? ix('q') : ix('question_text'), it = ix('t'), ic = ix('course_code');
                if (iq < 0 || it < 0) { bad = 1; return; }
                rows.slice(1).forEach(r => {
                    const q = String(r[iq] || '').trim(), t = String(r[it] || '').trim(), cc = ic >= 0 ? String(r[ic] || 'ALL').trim() : 'ALL';
                    if (!q || !t || D.qs.some(x => x.q == q && x.t == t && (x.course_code || 'ALL') == cc)) return;
                    D.qs.push({ id: nid(D.qs), t, course_code: cc, q }); n++;
                });
                save(); log('นำเข้าคำถาม ' + n + ' ข้อ'); i.value = '';
            });
            if (bad) return err('ไฟล์ CSV ต้องมีหัวคอลัมน์ t และ q (หรือ question_text)');
            ok('นำเข้า ' + n + ' ข้อ'); V.qs();
        }

        async function dDoc(id) { if (!await cf('ลบเอกสารนี้?')) return; await busy(async () => { D.docs = D.docs.filter(x => x.id != id); D.del = (D.del || []).concat(+id); save(); log('ลบเอกสาร'); }); ok('ลบแล้ว'); V.docs(); }
        
        const lv = (a, t) => { const x = a >= 4.5 ? ['ดีมาก', '#3BB489'] : a >= 3.5 ? ['ดี', '#0288D1'] : a >= 2.5 ? ['พอใช้', '#FBC02D'] : ['ควรปรับปรุง', '#EF5350']; return t ? x[0] : badge(x[0], x[1]); };
        
        function expRaw() {
            const f = S.rf || {}, rows = D.docs.filter(d => d.type == f.ty && (!f.t || d.teacher == f.t) && (!f.c || d.course == f.c) && (!f.s || d.sem == f.s) && (!f.y || d.year == f.y));
            const qs = [...new Set(rows.flatMap(d => (d.answers || []).map(a => a.q)))], w = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(w, XLSX.utils.aoa_to_sheet([['ลำดับ', 'ภาค', 'ปี', 'รายวิชา', 'อาจารย์', 'คะแนนเฉลี่ย', ...qs, 'ข้อเสนอแนะ'], ...rows.map((d, i) => [i + 1, d.sem, d.year, d.course, d.tname || '', d.score, ...qs.map(q => ((d.answers || []).find(a => a.q == q) || {}).score ?? ''), d.comment || ''])]), 'RawData');
            dl('raw_responses_anonymous.xlsx', xb(w)); log('ส่งออกข้อมูลดิบ (นิรนาม)');
        }
        function expR() { 
            const w = XLSX.utils.book_new(); 
            const isClo = S.rf && S.rf.g == 'clo';
            let head, data;
            if (isClo) {
                head = [
                    ['รายงานสรุปผลการประเมินผลลัพธ์การเรียนรู้ (CLO Achievement) เพื่อประกอบ มคอ.5/7'],
                    ['สถาบัน: ' + D.inst.name + ' | คณะ: ' + D.inst.org],
                    ['วันที่ส่งออก: ' + new Date().toLocaleDateString('th-TH')],
                    [],
                    ['ประเภท', 'ผลลัพธ์การเรียนรู้ / ข้อคำถาม', 'จำนวนผู้ประเมิน (N)', 'คะแนนเฉลี่ย (X̄)', 'ส่วนเบี่ยงเบนมาตรฐาน (S.D.)', 'ระดับคุณภาพ', 'ผลการบรรลุเป้าหมายตามเกณฑ์ มคอ. (≥3.50)']
                ];
                data = S.agg.map(a => [a.t || 'CLO', a.k, a.n, a.avg, a.sd, lv(a.avg, 1), a.targetMet ? 'บรรลุเกณฑ์' : 'ไม่บรรลุเกณฑ์']);
            } else {
                head = [
                    ['รายงานสรุปผลการประเมินการจัดการเรียนการสอน'],
                    ['สถาบัน: ' + D.inst.name],
                    [],
                    ['กลุ่มรายงาน', 'จำนวนผู้ประเมิน', 'คะแนนเฉลี่ย', 'S.D.', 'ระดับการประเมิน']
                ];
                data = S.agg.map(a => [a.k, a.n, a.avg, a.sd, lv(a.avg, 1)]);
            }
            const ws = XLSX.utils.aoa_to_sheet([...head, ...data]);
            if (!ws['!merges']) ws['!merges'] = [];
            ws['!merges'].push({s:{r:0,c:0}, e:{r:0,c: isClo ? 6 : 4}});
            XLSX.utils.book_append_sheet(w, ws, 'Report'); 
            dl(isClo ? 'CLO_Report_TQF5.xlsx' : 'report.xlsx', xb(w)); 
            log('ส่งออกรายงานผลประเมิน' + (isClo ? ' (CLO)' : '')); 
        }
        
        async function gsSave() {
            const c = { url: $('#gu').value.trim(), tk: $('#gk').value.trim() }; try { localStorage.setItem('nsys_gs', JSON.stringify(c)); } catch (e) { }
            let bad = 0; await busy(async () => { try { if (!c.url) { GST('ยังไม่ได้เชื่อมต่อ', 0); return; } const j = await fetch(gurl(c)).then(r => r.json()); if (!j.ok) throw Error(j.error); GST('เชื่อมต่อสำเร็จ', 1); log('ตั้งค่า Google Sheet'); } catch (e) { bad = 1; GST('เชื่อมต่อไม่ได้: ' + e.message, 0); } });
            if (bad) err('เชื่อมต่อไม่ได้ ตรวจสอบ URL, Token และสิทธิ์ Web App'); V.gs();
        }
        async function gsPush() { if (!cfg().url) return err('กรุณาตั้งค่า URL ก่อน'); let r; await busy(async () => { r = await gpush(1); }); r ? ok('ส่งข้อมูลขึ้น Sheet แล้ว') : err('ส่งข้อมูลไม่สำเร็จ'); V.gs(); }
        async function gsPull() { if (!cfg().url) return err('กรุณาตั้งค่า URL ก่อน'); if (!await cf('ข้อมูลในระบบจะถูกแทนที่ด้วยข้อมูลจาก Sheet')) return; let r, e0; await busy(async () => { try { r = await gpull(); } catch (e) { e0 = e; } }); if (e0) err('ดึงข้อมูลไม่สำเร็จ: ' + e0.message); else ok('ดึงข้อมูลแล้ว'); V.gs(); }
        async function gsOff() { if (!await cf('ยกเลิกการเชื่อมต่อ Google Sheet?')) return; try { localStorage.removeItem('nsys_gs'); } catch (e) { } GST('ยังไม่ได้เชื่อมต่อ', 0); log('ยกเลิกการเชื่อมต่อ Google Sheet'); V.gs(); }

        /* ---------- init ---------- */
        Promise.all([cfg().url ? Promise.race([gpull().catch(() => { }), new Promise(r => setTimeout(r, 5000))]) : 0, new Promise(r => setTimeout(r, 1400))]).then(() => { loginPage(); $('#splash').style.display = 'none'; });
    </script>
</body>
</html>
